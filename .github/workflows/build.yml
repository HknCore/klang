name: Build Klang.exe

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Set version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}".TrimStart("v") } else { "0.0.0" }
          "KLANG_VERSION=$v" >> $env:GITHUB_ENV

      - name: Security checks
        run: python tests/test_security.py

      - name: Build
        run: pyinstaller --noconfirm klang.spec

      - name: Smoke test
        shell: pwsh
        run: |
          function Wait-Klang {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep 1
              try {
                $page = Invoke-WebRequest http://127.0.0.1:8777/ -UseBasicParsing
                if ($page.Content -match 'name="klang-token" content="([^"]+)"') { return $Matches[1] }
              } catch {}
            }
            return $null
          }

          Start-Process dist\Klang.exe -ArgumentList "--mock", "--no-window"
          $token = Wait-Klang
          if (-not $token) { throw "Klang.exe did not start" }
          $h = @{ "X-Klang-Token" = $token }
          if (-not (Invoke-RestMethod http://127.0.0.1:8777/api/ping -Headers $h).ok) { throw "API not reachable" }
          $res = Invoke-RestMethod "http://127.0.0.1:8777/api/search?q=glass" -Headers $h
          if ($res.songs.Count -lt 1) { throw "Search returned nothing" }
          $blocked = try { Invoke-WebRequest http://127.0.0.1:8777/api/library -UseBasicParsing | Out-Null; $false } catch { $_.Exception.Response.StatusCode.value__ -eq 403 }
          if (-not $blocked) { throw "API answered without the secret" }
          taskkill /IM Klang.exe /F | Out-Null
          Start-Sleep 2

          # Normal start: Klang must open its own app window (not fall back to the browser)
          Remove-Item "$env:APPDATA\Klang\klang.log" -ErrorAction SilentlyContinue
          Start-Process dist\Klang.exe -ArgumentList "--mock"
          $ok = [bool](Wait-Klang)
          Start-Sleep 8
          $alive = @(Get-Process Klang -ErrorAction SilentlyContinue).Count -gt 0
          $log = Get-Content "$env:APPDATA\Klang\klang.log" -Raw -ErrorAction SilentlyContinue
          "--- klang.log ---"; $log
          taskkill /IM Klang.exe /F | Out-Null
          if (-not $ok -or -not $alive) { throw "Klang.exe did not keep running with a window" }
          if ($log -match "\[window\]") { throw "The native app window could not be opened" }

          "Klang.exe ${env:KLANG_VERSION}: $([math]::Round((Get-Item dist\Klang.exe).Length / 1MB, 1)) MB"

      - name: Embedded player check (information only)
        continue-on-error: true
        run: python tests/diag_embed.py

      - name: Real playback test
        continue-on-error: true
        shell: pwsh
        run: |
          function Wait-Klang {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep 1
              try {
                $page = Invoke-WebRequest http://127.0.0.1:8777/ -UseBasicParsing
                if ($page.Content -match 'name="klang-token" content="([^"]+)"') { return $Matches[1] }
              } catch {}
            }
            return $null
          }
          Start-Process dist\Klang.exe
          $token = Wait-Klang
          if (-not $token) { throw "Klang.exe did not start" }
          $h = @{ "X-Klang-Token" = $token }
          $ping = Invoke-RestMethod http://127.0.0.1:8777/api/ping -Headers $h
          Write-Host "::notice title=Player::hidden YouTube Music player available: $($ping.engine)"

          $songs = @("Billie Eilish birds of a feather", "Tarkan Kuzu Kuzu", "Ed Sheeran Shape of You", "Rammstein Du hast")
          $played = 0
          foreach ($q in $songs) {
            $res = Invoke-RestMethod "http://127.0.0.1:8777/api/search?q=$([uri]::EscapeDataString($q))" -Headers $h
            $song = $res.songs[0]
            if (-not $song) { Write-Host "::warning title=Playback::no search result for $q"; continue }
            $body = @{ cmd = "load"; videoId = $song.videoId; start = 0 } | ConvertTo-Json
            Invoke-RestMethod http://127.0.0.1:8777/api/engine/cmd -Method Post -Headers $h -Body $body -ContentType "application/json" | Out-Null
            $st = $null; $ok = $false
            for ($i = 0; $i -lt 45 -and -not $ok; $i++) {
              Start-Sleep 1
              $st = Invoke-RestMethod http://127.0.0.1:8777/api/engine/state -Headers $h
              $ok = ($st.want -eq $song.videoId) -and ($st.s -eq 1) -and ($st.t -gt 3) -and (-not $st.ad)
            }
            $summary = "state=$($st.s) t=$([math]::Round([double]$st.t,1)) ad=$($st.ad) err=$($st.err) needsYou=$($st.needsYou) ready=$($st.ready) status=$($st.ps.status) reason=$($st.ps.reason) url=$($st.url)"
            if ($ok) { $played++; Write-Host "::notice title=Played::$($song.title) ($($song.videoId)) $summary" }
            else { Write-Host "::warning title=Not played::$($song.title) ($($song.videoId)) $summary" }
          }
          $log = Get-Content "$env:APPDATA\Klang\klang.log" -Raw -ErrorAction SilentlyContinue
          if ($log) { Write-Host "::notice title=klang.log::$(($log -replace "`r?`n", ' | ').Substring(0, [math]::Min(900, $log.Length)))" }
          taskkill /IM Klang.exe /F | Out-Null
          Write-Host "::notice title=Playback::$played of $($songs.Count) songs played (build servers are often treated as bots by YouTube)"

      - uses: actions/upload-artifact@v4
        with:
          name: Klang-windows
          path: dist/Klang.exe

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Klang.exe --clobber
