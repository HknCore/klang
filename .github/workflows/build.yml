name: Build Klang.exe

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"

      - name: Set version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}".TrimStart("v") } else { "0.0.0" }
          "KLANG_VERSION=$v" >> $env:GITHUB_ENV

      - name: Security checks
        run: python tests/test_security.py

      - name: Build
        run: pyinstaller --noconfirm klang.spec

      - name: Smoke test
        shell: pwsh
        run: |
          function Wait-Klang {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep 1
              try {
                $page = Invoke-WebRequest http://127.0.0.1:8777/ -UseBasicParsing
                if ($page.Content -match 'name="klang-token" content="([^"]+)"') { return $Matches[1] }
              } catch {}
            }
            return $null
          }

          Start-Process dist\Klang.exe -ArgumentList "--mock", "--no-window"
          $token = Wait-Klang
          if (-not $token) { throw "Klang.exe did not start" }
          $h = @{ "X-Klang-Token" = $token }
          if (-not (Invoke-RestMethod http://127.0.0.1:8777/api/ping -Headers $h).ok) { throw "API not reachable" }
          $res = Invoke-RestMethod "http://127.0.0.1:8777/api/search?q=glass" -Headers $h
          if ($res.songs.Count -lt 1) { throw "Search returned nothing" }
          $blocked = try { Invoke-WebRequest http://127.0.0.1:8777/api/library -UseBasicParsing | Out-Null; $false } catch { $_.Exception.Response.StatusCode.value__ -eq 403 }
          if (-not $blocked) { throw "API answered without the secret" }
          taskkill /IM Klang.exe /F | Out-Null
          Start-Sleep 2

          # Normal start: Klang must open its own app window (not fall back to the browser)
          Remove-Item "$env:APPDATA\Klang\klang.log" -ErrorAction SilentlyContinue
          Start-Process dist\Klang.exe -ArgumentList "--mock"
          $ok = [bool](Wait-Klang)
          Start-Sleep 8
          $alive = @(Get-Process Klang -ErrorAction SilentlyContinue).Count -gt 0
          $log = Get-Content "$env:APPDATA\Klang\klang.log" -Raw -ErrorAction SilentlyContinue
          "--- klang.log ---"; $log
          taskkill /IM Klang.exe /F | Out-Null
          if (-not $ok -or -not $alive) { throw "Klang.exe did not keep running with a window" }
          if ($log -match "\[window\]") { throw "The native app window could not be opened" }

          "Klang.exe ${env:KLANG_VERSION}: $([math]::Round((Get-Item dist\Klang.exe).Length / 1MB, 1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: Klang-windows
          path: dist/Klang.exe

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Klang.exe --clobber
